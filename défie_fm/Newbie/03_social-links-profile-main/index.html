<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" size="32x32" href="assets/images/favicon-32x32.png">
  <title>Frontend Mentor | Social links profile</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; display:none;}
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>  
  <main>
    <div class="userPdpNameLoc">
      <div class="userPdp">
        <img src="assets/images/avatar-jessica.jpeg" alt="user avatar">
      </div>
      <p class="userName">Jessica Randall</p>
      <p class="userLoc">London, United Kingdom</p>
      <p class="userQuote">"Front-end developer and avid reader."</p>
    </div>
    <div class="userMediaLink">
      <div class="md github">Github</div>
      <div class="md frontendMentor">Frontend Mentor</div>
      <div class="md linkedin">Linkeln</div>
      <div class="md twitter">Twitter</div>
      <div class="md instagram">Instagram</div>
    </div>
  </main>


  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
